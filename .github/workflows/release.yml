name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag and Cargo version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match workspace version $version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and verify frontend
        run: |
          npm --prefix web ci
          npm --prefix web audit --audit-level=high
          npm --prefix web test
          npm --prefix web run build
          diff --recursive web/dist crates/kumokara-server/web-dist

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: kumokara-x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: kumokara-aarch64-unknown-linux-gnu
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: kumokara-x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            archive: kumokara-aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin kumokara

      - name: Verify release binary
        run: target/${{ matrix.target }}/release/kumokara --version

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ matrix.archive }}"
          mkdir -p "dist/$archive"
          cp "target/${{ matrix.target }}/release/kumokara" "dist/$archive/"
          cp README.md LICENSE "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: kumokara-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.tar.gz \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Kumokara $GITHUB_REF_NAME" \
            --generate-notes
