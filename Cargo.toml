[workspace]
resolver = "2"
members = [
    "crates/kumokara-protocol",
    "crates/kumokara-agent",
    "crates/kumokara-engine",
    "crates/kumokara-auth",
    "crates/kumokara-server",
    "crates/kumokara-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kumokara Contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
portable-pty = "0.9"

# Protocol crate (minimal deps)
kumokara-protocol = { path = "crates/kumokara-protocol" }

# Agent adapter API and built-in provider plugins
kumokara-agent = { path = "crates/kumokara-agent" }

# Engine
kumokara-engine = { path = "crates/kumokara-engine" }

# Auth
kumokara-auth = { path = "crates/kumokara-auth" }

# Server
kumokara-server = { path = "crates/kumokara-server" }

# CLI
kumokara-cli = { path = "crates/kumokara-cli" }

[profile.release]
opt-level = "z"
lto = true
strip = true
