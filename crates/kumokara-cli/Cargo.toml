[package]
name = "kumokara"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Self-hosted, agent-neutral persistent terminal for the browser"
readme = "../../README.md"
keywords = ["terminal", "agent", "self-hosted", "pty"]
categories = ["command-line-utilities", "development-tools"]
default-run = "kumokara"

[[bin]]
name = "kumokara"
path = "src/main.rs"

[dependencies]
kumokara-server.workspace = true
kumokara-engine.workspace = true
kumokara-auth.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
